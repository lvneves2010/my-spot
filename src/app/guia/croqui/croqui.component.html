<div class="croqui">
  <svg [attr.viewBox]="viewBox()" [style.transform]="'rotate(' + rotacao() + 'deg)'" aria-label="Croqui do caminho até o carro">
    @for (linha of linhas(); track $index) {
      <polyline [attr.points]="linha.pontos" class="rua" [class.pedestre]="linha.pedestre" />
    }

    @if (rotaPontos(); as pontos) {
      <polyline [attr.points]="pontos" class="rota" />
    } @else if (eu(); as eu) {
      <line [attr.x1]="eu.x" [attr.y1]="eu.y" x2="0" y2="0" class="caminho" />
    }

    <!-- vaga -->
    <circle cx="0" cy="0" [attr.r]="tamanho() * 1.1" class="carro" />
    <text
      x="0"
      y="0"
      class="letra-carro"
      [attr.font-size]="tamanho() * 1.3"
      [attr.transform]="'rotate(' + -rotacao() + ' 0 0)'"
    >P</text>

    <!-- usuário -->
    @if (eu(); as eu) {
      @if (setaUsuario(); as seta) {
        <path d="M0 -1 L0.8 0.6 L0 0.2 L-0.8 0.6 Z" [attr.transform]="seta" class="direcao-usuario" />
      }
      <circle [attr.cx]="eu.x" [attr.cy]="eu.y" [attr.r]="tamanho() * 0.75" class="usuario" />
    }

    <text
      [attr.x]="norte().x"
      [attr.y]="norte().y"
      class="letra-norte"
      [attr.font-size]="tamanho() * 1.2"
      [attr.transform]="'rotate(' + -rotacao() + ' ' + norte().x + ' ' + norte().y + ')'"
    >N</text>
  </svg>
  <span class="escala">⌀ {{ diametro() }} m</span>
</div>
@if (aviso(); as aviso) {
  <p class="aviso">{{ aviso }}</p>
}
<p class="creditos">© OpenFreeMap © colaboradores do OpenStreetMap</p>
